<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Voice Call Example</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }

        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Voice Call App</h1>
    <div>
        <button id="startCall" disabled>Start Call</button>
        <button id="acceptCall" style="display: none; background-color: #f59e0b; color: white;">Accept Call</button>
        <button id="endCall" disabled>End Call</button>
    </div>
    <div id="status">Connecting to signaling server...</div>
    <canvas id="visualizer" width="400" height="150" style="display: block; margin: 20px auto; background: #1e293b; border-radius: 8px; border: 1px solid #334155;"></canvas>
    <audio id="remoteAudio" autoplay></audio>

    <script>
        // Dynamically connect to the WebSocket on the same host and port
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        const ws = new WebSocket(wsUrl);
        
        const startCallBtn = document.getElementById('startCall');
        const acceptCallBtn = document.getElementById('acceptCall');
        const endCallBtn = document.getElementById('endCall');
        const remoteAudio = document.getElementById('remoteAudio');
        const statusDiv = document.getElementById('status');

        let localStream;
        let peerConnection;
        let pendingOffer = null;
        let pendingCandidates = [];
        
        // Audio visualizer variables
        let audioCtx;
        let analyser;
        let animationId;

        // Using Google's public STUN server for ICE candidate discovery
        const configuration = {
            'iceServers': [{'urls': 'stun:stun.l.google.com:19302'}]
        };

        ws.onopen = () => {
            console.log('Connected to the signaling server');
            statusDiv.textContent = 'Connected to signaling server. Ready to call.';
            startCallBtn.disabled = false;
        };

        ws.onclose = () => {
            statusDiv.textContent = 'Disconnected from signaling server.';
            startCallBtn.disabled = true;
            endCallBtn.disabled = true;
            acceptCallBtn.style.display = 'none';
        };

        // Handle messages from the signaling server
        ws.onmessage = async (event) => {
            const message = JSON.parse(event.data);
            console.log('Received message:', message.type);

            if (message.type === 'offer') {
                statusDiv.textContent = 'Incoming call... Click Accept!';
                pendingOffer = message.offer;
                startCallBtn.style.display = 'none';
                acceptCallBtn.style.display = 'inline-block';
            } else if (message.type === 'answer') {
                statusDiv.textContent = 'Call answered.';
                await handleAnswer(message.answer);
            } else if (message.type === 'ice-candidate') {
                await handleCandidate(message.candidate);
            }
        };

        async function createPeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);

            // Send any ice candidates to the other peer
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: 'ice-candidate',
                        candidate: event.candidate
                    }));
                }
            };

            // When a remote audio track arrives, play it in the <audio> element
            peerConnection.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
                setupVisualizer();
            };

            // Get local audio stream
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            } catch (error) {
                console.error("Error accessing media devices.", error);
                alert("Could not access microphone.");
            }
        }

        // Caller clicks "Start Call"
        startCallBtn.onclick = async () => {
            startCallBtn.disabled = true;
            endCallBtn.disabled = false;
            statusDiv.textContent = 'Calling...';
            
            await createPeerConnection();
            
            // Create an offer and send it to the signaling server
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            
            ws.send(JSON.stringify({
                type: 'offer',
                offer: offer
            }));
        };

        // Callee clicks "Accept Call"
        acceptCallBtn.onclick = async () => {
            acceptCallBtn.style.display = 'none';
            endCallBtn.disabled = false;
            statusDiv.textContent = 'Connecting...';
            
            await createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
            
            // Process any ICE candidates that arrived before we accepted
            for (const c of pendingCandidates) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(c));
            }
            pendingCandidates = [];
            
            // Create an answer and send it back
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            
            ws.send(JSON.stringify({
                type: 'answer',
                answer: answer
            }));
            
            statusDiv.textContent = 'In call';
        };

        // Caller receives the answer
        async function handleAnswer(answer) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            
            // Process any ICE candidates that arrived before the answer
            for (const c of pendingCandidates) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(c));
            }
            pendingCandidates = [];
        }

        // Both peers exchange ICE candidates
        async function handleCandidate(candidate) {
            if (peerConnection && peerConnection.remoteDescription) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            } else {
                // Queue candidate if remote description isn't set yet
                pendingCandidates.push(candidate);
            }
        }

        // End the call
        endCallBtn.onclick = () => {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            remoteAudio.srcObject = null;
            
            // Stop visualizer
            if (animationId) cancelAnimationFrame(animationId);
            const canvas = document.getElementById('visualizer');
            const canvasCtx = canvas.getContext('2d');
            canvasCtx.fillStyle = '#1e293b';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            startCallBtn.disabled = false;
            startCallBtn.style.display = 'inline-block';
            endCallBtn.disabled = true;
            acceptCallBtn.style.display = 'none';
            pendingOffer = null;
            pendingCandidates = [];
            statusDiv.textContent = 'Call ended.';
        };

        // --- Audio Visualizer ---
        function setupVisualizer() {
            if (animationId) return; // already running

            const canvas = document.getElementById('visualizer');
            const canvasCtx = canvas.getContext('2d');
            const audioElement = document.getElementById('remoteAudio');

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // Use MediaElementSource to avoid Chrome bug with WebRTC streams
            // Only create it once per audio element
            if (!analyser) {
                const source = audioCtx.createMediaElementSource(audioElement);
                analyser = audioCtx.createAnalyser();
                source.connect(analyser);
                analyser.connect(audioCtx.destination); // Required for MediaElementSource
                analyser.fftSize = 256;
            }
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                animationId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                
                canvasCtx.fillStyle = '#1e293b';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i];
                    
                    // Create a dynamic color gradient
                    canvasCtx.fillStyle = `rgb(${barHeight + 50}, 150, 250)`;
                    canvasCtx.fillRect(x, canvas.height - barHeight / 2, barWidth, barHeight / 2);
                    
                    x += barWidth + 1;
                }
            }
            draw();
        }
    </script>
</body>
</html>
