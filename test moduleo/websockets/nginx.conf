worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        # NGINX will listen on port 80
        listen 80;
        server_name localhost;

        # 1. Serve the static HTML file
        location / {
            # Note: NGINX uses forward slashes even on Windows
            root "C:/Users/dhanush/Akatsuki/test moduleo/websockets";
            index client.html;
        }

        # 2. Reverse Proxy for WebRTC WebSocket Signaling
        location /ws {
            # Forward traffic to the Python backend
            proxy_pass http://127.0.0.1:8080;
            
            # These headers are REQUIRED for WebSockets to work in NGINX
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Keep WebSocket connections open for a long time
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
